let currentFight = null;
let currentPhase = null;
let currentStrategy = null;

function renderFights() {
  const container = document.getElementById('fightList');
  container.innerHTML = '';
  Object.keys(data).forEach(fight => {
    const div = document.createElement('div');
    div.className = 'fight-item';
    div.innerText = fight;
    div.onclick = () => {
      selectFight(fight);
      closeMenu();
    };
    container.appendChild(div);
  });
}

function goHome() {
  currentFight = null;
  currentPhase = null;
  currentStrategy = null;
  document.getElementById('fight-title').innerText = '地方的哈魯不想讓你知道的攻略整合站';
  document.getElementById('fight-desc').innerHTML = `此攻略網主要是筆者為筆者的親友所建設，但不限於任何路過的參考或分享。有任何錯漏或建議歡迎告知筆者本人，不過筆者很懶。<br>
                        筆者只是為外語不好的親友整合筆者認為更可取的打法，筆者並非六絶亦不是99大佬，請不要抱有任何期待。o3o`;
  document.getElementById('phase-tabs').innerHTML = '';
  document.getElementById('strategy-buttons').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  closeMenu();
}

function selectFight(fight) {
  currentFight = fight;
  document.getElementById('fight-title').innerText = fight;
  document.getElementById('fight-desc').innerHTML = applyReplacements(data[fight].description) || '';
  renderPhases();
}

function renderPhases() {
  const phaseTabs = document.getElementById('phase-tabs');
  phaseTabs.innerHTML = '';

  const phases = data[currentFight].phases;
  const keys = Object.keys(phases);

  if (keys.length <= 1) {
    currentPhase = keys[0];
    renderStrategies();
    return;
  }

  keys.forEach(phase => {
    const tab = document.createElement('div');
    tab.className = 'phase-tab';
    tab.innerText = phase;
    tab.onclick = () => {
      currentPhase = phase;
      renderStrategies();
      document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    };
    phaseTabs.appendChild(tab);
  });

  currentPhase = keys[0];
  phaseTabs.children[0].classList.add('active');
  renderStrategies();
}

function renderStrategies() {
  const container = document.getElementById('strategy-buttons');
  container.innerHTML = '';

  const strategies = data[currentFight].phases[currentPhase].strategies;

  Object.keys(strategies).forEach(name => {
    const btn = document.createElement('div');
    btn.className = 'strategy-btn';
    btn.innerText = name;
    btn.onclick = () => showContent(name, btn);
    container.appendChild(btn);
  });

  const first = Object.keys(strategies)[0];
  if (first) {
    const firstBtn = container.children[0];
    showContent(first, firstBtn);
  }
}

function showContent(name, btnElement) {
  currentStrategy = name;

  document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
  if (btnElement) btnElement.classList.add('active');

  const contentDiv = document.getElementById('content');
  let raw = data[currentFight].phases[currentPhase].strategies[name].content;
  contentDiv.innerHTML = applyReplacements(raw);
}

function toggleTheme() {
  document.body.classList.toggle('dark');
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
}

renderFights();
</script>
